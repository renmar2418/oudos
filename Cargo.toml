[workspace]
resolver = "2"
members = [
    "crates/oud-protocol",
    "crates/oud-policy",
    "crates/oud-capture",
    "crates/oud-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
authors = ["Oudos Contributors"]

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.dev.package.openh264]
opt-level = 3

[profile.dev.package.openh264-sys2]
opt-level = 3
