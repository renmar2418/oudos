[package]
name = "oud-host-desktop"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
authors = ["Oudos Contributors"]
description = "Tauri v2 host agent with protected 520x660 consent card, persistent End session banner, and monochrome Facing Brackets tray icons."

[workspace]

[lib]
test = false

[[bin]]
name = "oud-host-desktop"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde", "clock"] }
oud-capture = { path = "../../../crates/oud-capture" }
oud-policy = { path = "../../../crates/oud-policy" }
oud-protocol = { path = "../../../crates/oud-protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
uuid = { version = "1.11", features = ["v7", "serde"] }

[lints.rust]
missing_docs = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
