# Optional self-hosted coturn configuration for strict symmetric-NAT relays.
# Enable with: docker compose -f deploy/docker-compose.yml --profile coturn up -d

listening-port=3478
tls-listening-port=5349
fingerprint
use-auth-secret
realm=oudos.local
min-port=49152
max-port=49252
no-multicast-peers
no-cli
stale-nonce
