services:
  oud-server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    restart: unless-stopped
    environment:
      OUD_BIND_ADDR: "0.0.0.0:8080"
      OUD_DB_PATH: "/var/lib/oudos/oudos.db"
      OUD_SERVER_KEY_PATH: "/var/lib/oudos/server.key"
      OUD_SERVER_DOMAIN: "${OUD_SERVER_DOMAIN:-localhost}"
      OUD_SERVER_SEED_HEX: "${OUD_SERVER_SEED_HEX:-}"
      OUD_TURN_MODE: "${OUD_TURN_MODE:-direct_p2p}"
      OUD_STUN_URL: "${OUD_STUN_URL:-stun:stun.cloudflare.com:3478}"
      OUD_COTURN_HOST: "${OUD_COTURN_HOST:-}"
      OUD_COTURN_PORT: "${OUD_COTURN_PORT:-3478}"
      OUD_COTURN_TLS_PORT: "${OUD_COTURN_TLS_PORT:-5349}"
      OUD_COTURN_SECRET: "${OUD_COTURN_SECRET:-}"
      OUD_CF_TURN_TOKEN_ID: "${OUD_CF_TURN_TOKEN_ID:-}"
      OUD_CF_TURN_API_TOKEN: "${OUD_CF_TURN_API_TOKEN:-}"
      RUST_LOG: "${RUST_LOG:-info}"
    volumes:
      - oudos_data:/var/lib/oudos
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - oudos_net

  web-pwa:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    depends_on:
      oud-server:
        condition: service_healthy
    ports:
      - "${OUD_HTTP_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - oudos_net

  caddy:
    image: caddy:2.8-alpine
    profiles: ["tls"]
    restart: unless-stopped
    depends_on:
      web-pwa:
        condition: service_healthy
    environment:
      OUD_SERVER_DOMAIN: "${OUD_SERVER_DOMAIN:-localhost}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - oudos_net

  coturn:
    image: coturn/coturn:4.6-alpine
    profiles: ["coturn"]
    restart: unless-stopped
    command:
      - "--static-auth-secret=${OUD_COTURN_SECRET:-change-me-coturn-secret}"
      - "--realm=${OUD_SERVER_DOMAIN:-oudos.local}"
      - "--listening-port=3478"
      - "--min-port=49152"
      - "--max-port=49252"
      - "--no-cli"
      - "--no-multicast-peers"
    ports:
      - "${OUD_COTURN_PORT:-3478}:3478/udp"
      - "${OUD_COTURN_PORT:-3478}:3478/tcp"
      - "49152-49252:49152-49252/udp"
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    networks:
      - oudos_net

volumes:
  oudos_data:
  caddy_data:
  caddy_config:

networks:
  oudos_net:
    driver: bridge
